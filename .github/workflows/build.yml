name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  macos:
    name: Tests and app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          scripts/build-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: FAP-Memo-Reviewer
          path: dist/FAP-Memo-Reviewer.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FAP-Memo-Reviewer.zip
